			<g id="g0">
				<g id="g1">
					<text id="t0" class="s4" x="0" y="19">Шабловский Станислав Иванович</text>
				</g>
				<g id="g2" transform="translate(0,25)">
					<text id="t1" class="s6" x="0" y="16">(1886 – ?)</text>
				</g>
				<g id="g3" transform="translate(0,55)">
					<text id="t2" class="s8" x="0" y="13">Отец: Шабловский Иван</text>
					<text id="t3" class="s8" x="0" y="31">Мать: Гуринович Розалия</text>
					<text id="t4" class="s8" x="0" y="49">Братья/сестры: Болеслав, Бронислав, Ядвига, Мария, Эмилия</text>
					<text id="t5" class="s8" x="0" y="67">Жена: Мальвина</text>
					<text id="t6" class="s8" x="0" y="85">Дочь: Виктория</text>
					<text id="t7" class="s8" x="0" y="121">Родился в 1886 г., д. Плашево Дзержинского р-на Минской обл.; поляк; образование н/начальное; крестьянин,</text>
					<text id="t8" class="s8" x="0" y="139">единоличное хоз-во. Проживал: Минская обл., Дзержинский р-н, д. Плашево.</text>
					<text id="t9" class="s8" x="0" y="157">Арестован 31 января 1930 г.</text>
					<text id="t10" class="s8" x="0" y="175">Приговорен: "тройка" 14 февраля 1930 г., обв.: 76 УК БССР - А/с агитация.</text>
					<text id="t11" class="s8" x="0" y="193">Приговор: 5 лет ИТЛ, отбыв.: Усевлон г.Котлас Реабилитирован 10 мая 1989 г. Прокуратура БССР</text>
					<text id="t12" class="s8" x="0" y="229">Источник: Белорусский "Мемориал"</text>
				</g>
				<g id="g4" transform="translate(0,303)">
					<g id="g5">
						<text id="t13" class="s8" x="0" y="13">Сын:</text>
						<text id="t14" class="s9 po" x="33" y="13" data-link="p63.html">Шабловский Степан Станиславович (? – Между 1930 и 1938)</text>
					</g>
				</g>
				<g id="g6" transform="translate(0,335)">
					<g id="g12" transform="translate(37,0)">
						<text id="t18" class="s10" x="0" y="13">1886</text>
					</g>
					<g id="g13" transform="translate(76,0)">
						<text id="t19" class="s8" x="0" y="13">Родился</text>
						<text id="t20" class="s8" x="52" y="13">. Место:</text>
						<text id="t21" class="s8" x="104" y="13">Плашево</text>
						<text id="t22" class="s8" x="160" y="13">.</text>
					</g>
					<path id="l0" class="s1" d="M0 20h673" />
					<g id="g15" transform="translate(76,23)">
						<text id="t23" class="s8" x="0" y="13">Родился сын</text>
						<text id="t24" class="s8" x="79" y="13">:</text>
						<text id="t25" class="s9 po" x="86" y="13" data-link="p63.html">Шабловский Степан Станиславович</text>
						<text id="t26" class="s8" x="306" y="13">.</text>
					</g>
					<path id="l1" class="s1" d="M0 43h673" />
					<g id="g16" transform="translate(19,46)">
						<text id="t27" class="s10" x="0" y="13">03.1930</text>
					</g>
					<g id="g17" transform="translate(76,46)">
						<text id="t28" class="s8" x="0" y="13">Ссылка</text>
						<text id="t29" class="s8" x="46" y="13">. Участники:</text>
						<text id="t30" class="s9 po" x="122" y="13" data-link="p14.html">Козлова (Уласевич) Франя Доминиковна (02.02.1911 – 18.06.2002)</text>
						<text id="t31" class="s8" x="525" y="13">,</text>
						<text id="t32" class="s9 po" x="0" y="31" data-link="p63.html">Шабловский Степан Станиславович (? – Между 1930 и 1938)</text>
						<text id="t33" class="s8" x="370" y="31">,</text>
						<text id="t34" class="s9 po" x="377" y="31" data-link="p161.html">(Шабловская) Ядвига Степановна</text>
						<text id="t35" class="s9 po" x="0" y="49" data-link="p161.html">(Около 1929 – ?)</text>
						<text id="t36" class="s8" x="101" y="49">. Место:</text>
						<text id="t37" class="s8" x="153" y="49">Новиково</text>
						<text id="t38" class="s8" x="211" y="49">.</text>
					</g>
					<path id="l2" class="s1" d="M0 102h673" />
					<g id="g18" transform="translate(1,105)">
						<text id="t39" class="s10" x="0" y="13">23.09.1992</text>
					</g>
					<g id="g19" transform="translate(76,105)">
						<text id="t40" class="s8" x="0" y="13">Реабилитация</text>
						<text id="t41" class="s8" x="88" y="13">. Участники:</text>
						<text id="t42" class="s9 po" x="164" y="13" data-link="p8.html">Дубовик (Козлова) Ренида Михайловна (21.02.1941)</text>
						<text id="t43" class="s8" x="481" y="13">,</text>
						<text id="t44" class="s9 po" x="489" y="13" data-link="p14.html">Козлова</text>
						<text id="t45" class="s9 po" x="0" y="31" data-link="p14.html">(Уласевич) Франя Доминиковна (02.02.1911 – 18.06.2002)</text>
						<text id="t46" class="s8" x="350" y="31">,</text>
						<text id="t47" class="s9 po" x="357" y="31" data-link="p28.html">Козлов Виктор Михайлович (21.05.1939</text>
						<text id="t48" class="s9 po" x="0" y="49" data-link="p28.html">– 18.03.2009)</text>
						<text id="t49" class="s8" x="80" y="49">,</text>
						<text id="t50" class="s9 po" x="87" y="49" data-link="p63.html">Шабловский Степан Станиславович (? – Между 1930 и 1938)</text>
						<text id="t51" class="s8" x="457" y="49">.</text>
					</g>
					<path id="l3" class="s1" d="M0 161h673" />
					<g id="g21" transform="translate(76,164)">
						<text id="t52" class="s8" x="0" y="13">Умер</text>
						<text id="t53" class="s8" x="32" y="13">.</text>
					</g>

			<script type="text/javascript">//<![CDATA[
navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else {
		a[i].addEventListener('click', jumpTo);
	}
}
a = undefined;

window.parent.postMessage({event_id: 'gmsg', data: 'g4824'}, '*');
window.addEventListener('keydown', function(e){ if( (e.keyCode && e.keyCode === 27) || ( e.code && e.code === "Escape") ) window.parent.postMessage({event_id: 'gclose', data: 'close'}, '*'); }, false );
window.addEventListener('DOMContentLoaded', function (){ window.parent.postMessage({event_id: 'gheight', data: document.body.scrollHeight}, '*');});
//]]></script>
