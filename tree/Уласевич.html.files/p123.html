				<g id="g3">
					<text id="t1" class="s6" x="246" y="19">Уласевич Антон Викентьевич</text>
				</g>
				<g id="g4" transform="translate(0,25)">
					<text id="t2" class="s8" x="246" y="16">(1864 – 1945)</text>
				</g>
				<g id="g5" transform="translate(0,55)">
					<text id="t3" class="s10" x="246" y="13">Продолжительность жизни: Около 81</text>
					<text id="t4" class="s10" x="246" y="31">Альтернативные имена: Antoni</text>
					<text id="t5" class="s10" x="246" y="49">Уласевич Антон Викентьевич</text>
					<text id="t6" class="s10" x="246" y="67">Родился в 1866 г., д. Плашево Койдановского уезда Минской губ.;</text>
					<text id="t7" class="s10" x="246" y="85">белорус; образование н/начальное; крестьянин, единоличное хоз-во.</text>
					<text id="t8" class="s10" x="246" y="103">Проживал: Минская обл., Дзержинский р-н, д. Плашево.</text>
					<text id="t9" class="s10" x="246" y="121">Арестован 17 марта 1928 г.</text>
					<text id="t10" class="s10" x="246" y="139">Приговорен: ОСО 27 июля 1928 г., обв.: 58-6, 59-9, 10 УК РСФСР -</text>
					<text id="t11" class="s10" x="246" y="157">шпионаж.к/банда, содей.перех.границы.</text>
					<text id="t12" class="s10" x="246" y="175">Приговор: 3 года высылки, отбыв.: Приангарский край, освоб. 1931</text>
					<text id="t13" class="s10" x="246" y="193">Реабилитирован 31 августа 1993 г. Военпрокуратура РБ</text>
					<text id="t14" class="s10" x="246" y="211">Источник: Белорусский "Мемориал"</text>
				</g>
				<g id="g8" transform="translate(0,338)">
					<g id="g9">
						<text id="t48" class="s10" x="0" y="13">Отец:</text>
						<text id="t49" class="s11 po" x="37" y="13" data-link="p21.html">Уласевич Викентий Иосифович (1832 – 1903)</text>
						<text id="t50" class="s10" x="0" y="31">Мать:</text>
						<text id="t51" class="s11 po" x="37" y="31" data-link="p122.html">Уласевич (Ячная) Анна (1835 – 1903)</text>
						<text id="t52" class="s10" x="0" y="49">Сестра:</text>
						<text id="t53" class="s11 po" x="50" y="49" data-link="p144.html">(Уласевич) Михалина Викентьевна (1859 – 1877)</text>
						<text id="t54" class="s10" x="0" y="67">Сестра:</text>
						<text id="t55" class="s11 po" x="50" y="67" data-link="p143.html">(Уласевич) Антонина Викентьевна (1861 – ?)</text>
						<text id="t56" class="s10" x="0" y="85">Брат:</text>
						<text id="t57" class="s11 po" x="36" y="85" data-link="p24.html">Уласевич Иосиф Викентьевич (1863 – ?)</text>
						<text id="t58" class="s10" x="0" y="103">Брат:</text>
						<text id="t59" class="s11 po" x="36" y="103" data-link="p15.html">Уласевич Доминик Викентьевич (1870 – Предположительно 1918)</text>
						<text id="t60" class="s10" x="0" y="121">Брат:</text>
						<text id="t61" class="s11 po" x="36" y="121" data-link="p142.html">Уласевич Юлиан Викентьевич (24.03.1871 – 1880)</text>
						<text id="t62" class="s10" x="0" y="139">Брат:</text>
						<text id="t63" class="s11 po" x="36" y="139" data-link="p139.html">Уласевич Иван Викентьевич (13.08.1874 – 1906)</text>
						<text id="t64" class="s10" x="0" y="157">Жена:</text>
						<text id="t65" class="s11 po" x="40" y="157" data-link="p129.html">Уласевич (Романович) Мария (1875 – 1930)</text>
						<text id="t66" class="s10" x="0" y="175">    Дочь:</text>
						<text id="t67" class="s11 po" x="51" y="175" data-link="p127.html">(Уласевич) Моника Антоновна (1898 – 1985)</text>
						<text id="t68" class="s10" x="0" y="193">    Дочь:</text>
						<text id="t69" class="s11 po" x="51" y="193" data-link="p81.html">Бейшер (Уласевич) София Антоновна (1901 – ?)</text>
						<text id="t70" class="s10" x="0" y="211">    Сын:</text>
						<text id="t71" class="s11 po" x="47" y="211" data-link="p125.html">Уласевич Иван Антонович (1902 – ?)</text>
						<text id="t72" class="s10" x="0" y="229">    Дочь:</text>
						<text id="t73" class="s11 po" x="51" y="229" data-link="p133.html">(Уласевич) Текля Антоновна (1906 – ?)</text>
						<text id="t74" class="s10" x="0" y="247">    Сын:</text>
						<text id="t75" class="s11 po" x="47" y="247" data-link="p29.html">Уласевич Франц Антонович (1909 – ?)</text>
						<text id="t76" class="s10" x="0" y="265">    Дочь:</text>
						<text id="t77" class="s11 po" x="51" y="265" data-link="p235.html">(Уласевич) Валентина Антоновна (После 1910 – ?)</text>
						<text id="t78" class="s10" x="0" y="283">    Дочь:</text>
						<text id="t79" class="s11 po" x="51" y="283" data-link="p140.html">(Уласевич) Станислава Антоновна (1912 – 2007)</text>
					</g>

			<script type="text/javascript">//<![CDATA[
navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else {
		a[i].addEventListener('click', jumpTo);
	}
}
a = undefined;
