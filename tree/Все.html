			<script type="text/javascript">//<![CDATA[
navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else {
		a[i].addEventListener('click', jumpTo);
	}
}
a = undefined;

window.addEventListener('DOMContentLoaded', function(){
	var svg = document.getElementById('svg0');
	var e = document.getElementById(svg.dataset.root);
	e && scrollToView(e);
});
var p = null;
function startDrag(e, x, y) {
	if(!e.ctrlKey) return;
	p = { x: x, y: y }
}
function endDrag(e) {
	p = null;
}
function onMove(e, x, y) {
	if(p) {
		if(!e.ctrlKey){
			p = null;
		} else {
			window.scrollTo({
				top: window.pageYOffset-(y-p.y),
				left: window.pageXOffset-(x-p.x)
			})
			e.preventDefault();
		}
	}
}
document.addEventListener('mouseup', endDrag, false );
document.addEventListener('mousedown', function(e){ startDrag(e, e.pageX, e.pageY) }, false );
document.addEventListener('mousemove', function(e){ onMove(e, e.pageX, e.pageY) }, false );
var currpos = 0;
var currgid = 0;
var modal,mc,mcw;
function updateModalHeight(fh) {
	if(modal.clientHeight * 0.87 < fh + 40 ) {
		mcw.style.height = '87%';
		mc.style.height = '98%';
	}else{
		mcw.style.height = 'auto';
		mc.style.height = fh + 40 + 'px';
	}
}
window.addEventListener('DOMContentLoaded', function (){
	modal = document.getElementById('myModal');
	mc = document.getElementById('modalContent');
	mcw = document.getElementById('modalContentWrap');
	window.addEventListener('message', function (event) {
		if (event.data.event_id === 'gmsg') currgid = event.data.data;
		if (event.data.event_id === 'gclose') closemodal();
		if (event.data.event_id === 'gheight') updateModalHeight(event.data.data);
	});
	window.addEventListener('keydown', function(e){ if( (e.keyCode && e.keyCode === 27) || ( e.code && e.code === "Escape") ) closemodal(); }, false );

	var navToPerson = function () {
		mc.innerHTML = '<iframe id="idetail" onload="currpos+=1;" src="Все.html.files/p' + this.dataset.id + '.html?v=1" class="modal-frame"></iframe>';
		modal.style.display = 'block';
	}
	function closemodal() { modal.style.display = "none"; currpos = 0; }
	var spanback = document.getElementsByClassName("back")[0];
	spanback.onclick = function () { if (currpos > 1) { window.history.back(); currpos -= 2; } else closemodal(); }
	var spanx = document.getElementsByClassName("close")[0];
	spanx.onclick = closemodal;
	var spantree = document.getElementsByClassName("tree")[0];
	spantree.onclick = function () {
		closemodal();
		var elmnt = document.getElementById(currgid);
		if( elmnt ) scrollToView(elmnt);
	}
	window.onclick = function (event) { if (event.target === modal) closemodal(); }
	var a = document.querySelectorAll('[data-id]');
	for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navToPerson);
	a = undefined;
});
//]]></script>
