				<g id="g3">
					<text id="t1" class="s6" x="247" y="19">Хоровец Иван Михайлович</text>
				</g>
				<g id="g4" transform="translate(0,25)">
					<text id="t2" class="s8" x="247" y="16">(13.12.1905 – 1981)</text>
				</g>
				<g id="g5" transform="translate(0,55)">
					<text id="t3" class="s10" x="247" y="13">Место жительства:</text>
					<text id="t4" class="s10" x="365" y="13">Бобровичи</text>
					<text id="t5" class="s10" x="247" y="31">Продолжительность жизни: Около 75</text>
					<text id="t6" class="s10" x="247" y="49">"Козел"</text>
					<text id="t7" class="s10" x="247" y="67">слесарь, столяр</text>
					<text id="t8" class="s10" x="247" y="85">неграмотный</text>
					<text id="t9" class="s10" x="247" y="103">рассказывал сказки, бил жену</text>
					<text id="t10" class="s10" x="247" y="121">ездил на целину в Костанай, Казахстан, работал комбайнером, около</text>
					<text id="t11" class="s10" x="247" y="139">1960</text>
					<text id="t12" class="s10" x="247" y="157">купил дом в Бобровичах и переехал</text>
					<text id="t13" class="s10" x="247" y="193">[?]</text>
					<text id="t14" class="s10" x="247" y="211">построил кровать с двойным дном, чтобы прятаться от военкомата и</text>
					<text id="t15" class="s10" x="247" y="229">немцев</text>
					<text id="t16" class="s11 po" x="247" y="265" data-link="https://pamyat-naroda.ru/heroes/memorial-chelovek_vpp2005139839/">https://pamyat-naroda.ru/heroes/memorial-chelovek_vpp2005139839/</text>
					<text id="t17" class="s11 po" x="247" y="283" data-link="https://pamyat-naroda.ru/heroes/person-hero34678669/">https://pamyat-naroda.ru/heroes/person-hero34678669/</text>
				</g>

navTo = function() {
	if (this.dataset.link.match(/^(?!https?:\/\/).+?\.html?$/i))
		window.location.href = this.dataset.link;
	else
		window.open(this.dataset.link, '_blank');
};
var a = document.querySelectorAll('[data-link]');
for(var i = 0; i < a.length; i++) a[i].addEventListener('click', navTo);
a = undefined;
function scrollToView(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView({block: "center", inline: "center"});
	else
	{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top - window.innerHeight / 2, left: window.pageXOffset + r.left - window.innerWidth / 2})
	}
}
function scrollToViewTop(e){
	if(typeof e.scrollIntoView != 'undefined')
        e.scrollIntoView(true);
	else{
		var r = e.getBoundingClientRect()
		window.scrollTo({ top: window.pageYOffset + r.top})
	}
}
jumpTo = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToView(e); }
jumpToTop = function(){ var e = document.getElementById(this.dataset.ref); e && scrollToViewTop(e); }
var _tmp;
a = document.querySelectorAll('[data-ref]');
for(var i = 0; i < a.length; i++){
	if( a[i].dataset.ref.match( /^[0-9]/ ) ) {
		_tmp = document.querySelector('[data-id="' + a[i].dataset.ref + '"]')
		if(_tmp){
            a[i].dataset.ref = _tmp.id;
		    a[i].addEventListener('click', jumpToTop);
        }
	}else {
		a[i].addEventListener('click', jumpTo);
	}
}
a = undefined;
